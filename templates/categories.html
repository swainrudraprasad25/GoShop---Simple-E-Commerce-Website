{% extends "base.html" %}
{% block title %}Categories{% endblock %}

{% block content %}
<h1>Categories</h1>
<div class="grid">
  {% for c in categories %}
    <a href="/categories/{{ c.id }}" class="card center">
      <img src="/static/images/categories/{{ c.image }}" class="small" alt="{{ c.name }}">
      <h3>{{ c.name }}</h3>
      <p class="muted">{{ c.description }}</p>
      <p class="muted">{{ c.products|length }} products</p>
    </a>
  {% endfor %}
</div>
{% endblock %}
